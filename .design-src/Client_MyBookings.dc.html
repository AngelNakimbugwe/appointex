<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1, h2, .head { font-family: "Manrope", system-ui, sans-serif; }
    .navicon { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#FFFFFF; display:flex; flex-direction:column; overflow:hidden;">

  <div style="flex-shrink:0; padding:20px 18px 8px;">
    <span class="head" style="font-size:19px; font-weight:800; color:#6B3F3A;">My bookings</span>
  </div>
  <div style="flex-shrink:0; display:flex; gap:22px; padding:10px 18px 0;">
    <div style="padding-bottom:10px; border-bottom:2.5px solid #FFB5A7;"><span style="font-size:13.5px; font-weight:700; color:#6B3F3A;">Upcoming</span></div>
    <div style="padding-bottom:10px;"><span style="font-size:13.5px; font-weight:600; color:#9A9A9A;">Past</span></div>
  </div>

  <div style="flex:1; overflow:hidden; padding:14px 18px; display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; gap:12px; padding:13px; border:1px solid #ECE7DC; border-radius:14px;">
      <div style="width:46px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#6B3F3A; border-radius:10px; padding:8px 0;">
        <span style="font-size:10px; color:#FEC89A; font-weight:700;">AUG</span>
        <span style="font-size:16px; color:#FFFFFF; font-weight:800;">26</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:3px; flex:1;">
        <span style="font-size:13.5px; font-weight:700; color:#6B3F3A;">Patricia Glam Studio</span>
        <span style="font-size:12px; color:#8A8A8A;">Bridal makeup, full glam &middot; 12:00 pm</span>
      </div>
      <div style="align-self:flex-start; padding:4px 9px; border-radius:8px; background:#EAF3EC;"><span style="font-size:10.5px; font-weight:700; color:#2E8B57;">Confirmed</span></div>
    </div>

    <div style="display:flex; gap:12px; padding:13px; border:1px solid #ECE7DC; border-radius:14px;">
      <div style="width:46px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#6B3F3A; border-radius:10px; padding:8px 0;">
        <span style="font-size:10px; color:#FEC89A; font-weight:700;">SEP</span>
        <span style="font-size:16px; color:#FFFFFF; font-weight:800;">12</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:3px; flex:1;">
        <span style="font-size:13.5px; font-weight:700; color:#6B3F3A;">Event: Wedding team</span>
        <span style="font-size:12px; color:#8A8A8A;">Hair, makeup &amp; photography &middot; from 9:00 am</span>
      </div>
      <div style="align-self:flex-start; padding:4px 9px; border-radius:8px; background:#EAF3EC;"><span style="font-size:10.5px; font-weight:700; color:#2E8B57;">Confirmed</span></div>
    </div>

    <span style="font-size:11.5px; font-weight:700; letter-spacing:0.05em; color:#9A9A9A; text-transform:uppercase; margin-top:6px;">Past</span>

    <div style="display:flex; flex-direction:column; gap:9px; padding:13px; border:1px solid #ECE7DC; border-radius:14px; opacity:0.85;">
      <div style="display:flex; gap:12px;">
        <div style="width:46px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#F0EEE9; border-radius:10px; padding:8px 0;">
          <span style="font-size:10px; color:#9A9A9A; font-weight:700;">JUL</span>
          <span style="font-size:16px; color:#5B5B5B; font-weight:800;">14</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:3px; flex:1;">
          <span style="font-size:13.5px; font-weight:700; color:#6B3F3A;">Grace Nabbosa Braids</span>
          <span style="font-size:12px; color:#8A8A8A;">Box braids &middot; Completed</span>
        </div>
      </div>
      <div style="display:flex; gap:8px; padding-left:58px;">
        <div style="padding:8px 14px; border-radius:16px; background:linear-gradient(135deg,#FEC89A,#FFB5A7);"><span style="font-size:12px; font-weight:700; color:#6B3F3A;">Rebook</span></div>
        <div style="padding:8px 14px; border-radius:16px; border:1px solid #E0DBCF;"><span style="font-size:12px; font-weight:600; color:#3A3A3A;">Leave a review</span></div>
      </div>
    </div>
  </div>

  <div style="flex-shrink:0; height:64px; display:flex; border-top:1px solid #ECE7DC;">
    <div class="navicon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
      <span style="font-size:10px; color:#B3B3B3;">Home</span>
    </div>
    <div class="navicon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B3F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      <span style="font-size:10px; font-weight:700; color:#6B3F3A;">Bookings</span>
    </div>
    <div class="navicon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-8.5 8.5H5l-2 2V11.5a8.5 8.5 0 018.5-8.5h1a8.5 8.5 0 018.5 8.5z"/></svg>
      <span style="font-size:10px; color:#B3B3B3;">Chat</span>
    </div>
    <div class="navicon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:10px; color:#B3B3B3;">Profile</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
