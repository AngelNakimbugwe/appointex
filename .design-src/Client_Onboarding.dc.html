<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1, h2, .head { font-family: "Manrope", system-ui, sans-serif; }
    a { color: #A66A5D; } a:hover { color: #4A2B27; }
    .btn { border-radius: 25px; height: 50px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; box-sizing:border-box; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#FFFFFF; display:flex; flex-direction:column; position:relative; overflow:hidden;">
  <div style="flex:1 1 62%; background:#F8EDEB; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;">
    <div style="position:absolute; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle,#FFB5A7,transparent 70%); opacity:0.28; right:-90px; top:-90px;"></div>
    <div style="position:absolute; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,#D98B96,transparent 70%); opacity:0.30; left:-100px; bottom:-90px;"></div>
    <div style="position:absolute; width:170px; height:170px; border-radius:50%; background:radial-gradient(circle,#FEC89A,transparent 70%); opacity:0.45; right:10px; bottom:30px;"></div>
    <div style="position:absolute; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,#FFB5A7,transparent 70%); opacity:0.22; left:30px; top:60px;"></div>
    <div style="z-index:1; display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 40px;">
      <div style="width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#6B3F3A,#A66A5D); box-shadow:0 10px 26px rgba(61,64,91,0.35); display:flex; align-items:center; justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95"/><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95" transform="rotate(60 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95" transform="rotate(120 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95" transform="rotate(180 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95" transform="rotate(240 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="4.3" fill="#FFFFFF" opacity="0.95" transform="rotate(300 12 12)"/><circle cx="12" cy="12" r="2.4" fill="#FEC89A"/></svg>
      </div>
      <span class="head" style="color:#6B3F3A; font-size:26px; font-weight:800; letter-spacing:-0.01em;">Appointex</span>
      <span style="color:#7A4F48; font-size:14px; text-align:center; line-height:1.6;">Book hair, makeup, nails, spa, massage and photography, all in one app.</span>
    </div>
  </div>
  <div style="flex:1 1 38%; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:28px 28px 40px;">
    <div class="btn" style="background:linear-gradient(135deg,#FEC89A,#FFB5A7); color:#6B3F3A;">Create account</div>
    <div class="btn" style="background:#FFFFFF; color:#6B3F3A; border:1.5px solid #6B3F3A;">Log in</div>
    <span style="text-align:center; font-size:12.5px; color:#8A8A8A; margin-top:6px;">or <a href="#">continue browsing as a guest</a></span>
  </div>
</div>
</x-dc>
